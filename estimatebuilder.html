<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Good &amp; Handy — Estimate Builder</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy:#1B3A6B; --blue:#2C5F9E; --sky:#D6E4F7; --green:#2a9d6e;
  --gray:#f2f4f8; --line:#e0e5ef; --text:#1a1d2e; --muted:#6b7280;
  --white:#fff; --accent:#e05c2a; --shadow:0 2px 16px rgba(27,58,107,.10);
  --radius:12px; --tap:48px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:'DM Sans',sans-serif;background:var(--gray);color:var(--text);min-height:100vh;padding-bottom:200px}

/* ── Header ── */
.hdr{background:var(--navy);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.hdr-title h1{font-family:'DM Serif Display',serif;color:#fff;font-size:1.35rem;line-height:1}
.hdr-title p{color:#a8c0e8;font-size:0.72rem;margin-top:3px}
.hdr-total{background:var(--green);color:#fff;border-radius:10px;padding:8px 16px;text-align:center;min-width:130px}
.hdr-total .lbl{font-size:0.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.hdr-total .amt{font-family:'DM Serif Display',serif;font-size:1.55rem;line-height:1.1}
.save-indicator{font-size:0.68rem;color:#a8c0e8;text-align:center;padding:4px 0;background:var(--navy);letter-spacing:.04em}

/* ── Layout ── */
.wrap{max-width:860px;margin:0 auto;padding:16px 12px}

/* ── Cards ── */
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.card-head{font-family:'DM Serif Display',serif;font-size:1.05rem;color:var(--navy);padding:14px 16px 10px;border-bottom:2px solid var(--sky)}
.card-body{padding:12px 16px}

/* ── Job Info fields ── */
.field-row{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field-row label{font-size:0.82rem;font-weight:600;color:var(--navy)}
.field-row input,.field-row textarea,.field-row select{
  width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;
  font-family:'DM Sans',sans-serif;font-size:0.92rem;color:var(--text);background:#fff;
  min-height:var(--tap);
}
.field-row textarea{min-height:72px;resize:vertical}
.field-row input:focus,.field-row textarea:focus{outline:none;border-color:var(--blue)}

/* ── Custom lines ── */
.cust-row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:12px 0;border-bottom:1px solid var(--line)}
.cust-row:last-child{border-bottom:none}
.cust-desc{flex:1;min-width:160px;display:flex;flex-direction:column;gap:3px}
.cust-desc span{font-size:0.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cust-desc input{width:100%;padding:10px 10px;border:1.5px solid var(--line);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:0.88rem;min-height:44px}
.cust-desc input:focus{outline:none;border-color:var(--blue)}
.cust-det{flex:1 1 100%;display:flex;flex-direction:column;gap:3px}
.cust-det span{font-size:0.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cust-det input{width:100%;padding:10px 10px;border:1.5px solid var(--line);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:0.88rem;min-height:44px}
.cust-det input:focus{outline:none;border-color:var(--blue)}
.inp-grp{display:flex;flex-direction:column;gap:3px}
.inp-grp span{font-size:0.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.inp-grp input[type=number]{width:80px;padding:10px 10px;border:1.5px solid var(--line);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:0.88rem;text-align:right;min-height:44px}
.inp-grp input[type=number]:focus{outline:none;border-color:var(--blue)}
.rm-btn{background:none;border:1.5px solid var(--line);border-radius:8px;color:var(--muted);font-size:1rem;cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0;align-self:flex-end}
.rm-btn:active{background:#fee2e2;border-color:#f87171;color:#dc2626}
.add-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:13px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:0.92rem;font-weight:600;cursor:pointer;margin-top:12px;min-height:var(--tap)}
.add-btn:active{background:var(--navy)}

/* ── Summary ── */
.summary-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;border-left:4px solid var(--green);overflow:hidden}
.s-head{font-family:'DM Serif Display',serif;font-size:1.05rem;color:var(--navy);padding:14px 16px 10px}
.s-body{padding:0 16px 12px}
.s-line{display:flex;justify-content:space-between;font-size:0.85rem;padding:6px 0;border-bottom:1px dashed var(--line)}
.s-line:last-child{border-bottom:none}
.s-line.tot{font-weight:700;font-size:0.98rem;color:var(--navy);padding-top:10px;margin-top:4px;border-top:2px solid var(--navy);border-bottom:none}
.s-empty{font-size:0.85rem;color:var(--muted);font-style:italic;padding:4px 0}
.s-line .s-det{font-size:0.75rem;color:var(--muted);margin-top:1px}

/* ── Action buttons ── */
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.btn-row .btn-gen{grid-column:1/-1}
.btn{padding:15px;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:0.95rem;font-weight:700;cursor:pointer;min-height:var(--tap);transition:background .15s}
.btn-calc{background:var(--blue);color:#fff}
.btn-calc:active{background:var(--navy)}
.btn-clr{background:#f0f3fa;color:var(--navy);border:1.5px solid var(--line)}
.btn-clr:active{background:#e4e9f5}
.btn-gen{background:var(--navy);color:#fff}
.btn-gen:active{background:#0f2040}

/* ── Estimate View ── */
.est-doc{max-width:720px;margin:0 auto;padding:40px 28px 80px}
.pdf-toolbar{background:var(--navy);padding:14px 20px;display:flex;align-items:center;justify-content:center;gap:10px;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.pdf-btn{background:var(--green);color:#fff;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:0.9rem;cursor:pointer;padding:12px 22px;min-height:44px}
.pdf-btn:active{opacity:.85}
.pdf-btn[disabled]{opacity:.6;cursor:default}
.pdf-hint{color:#a8c0e8;font-size:0.7rem;text-align:center;margin-top:6px}
@media print{.pdf-toolbar{display:none}}
.est-top{text-align:center;margin-bottom:24px}
.est-logo{max-width:170px;width:100%;height:auto;display:block;margin:0 auto 8px}
.est-tag{font-size:0.72rem;letter-spacing:.12em;text-transform:uppercase;color:#888;margin-top:4px}
.est-h1{font-size:1.45rem;font-weight:700;text-align:center;margin:16px 0 22px}
.est-field-row{display:flex;align-items:baseline;gap:6px;margin-bottom:8px}
.efl{font-weight:700;font-size:0.88rem;white-space:nowrap}
.efv{flex:1;border-bottom:1.5px solid #111;min-width:60px;font-size:0.88rem;padding-bottom:2px;padding-left:4px;color:#111}
.est-sec{font-weight:700;font-size:0.92rem;margin:20px 0 8px}
.est-table{width:100%;border-collapse:collapse;font-size:0.85rem;margin-bottom:6px}
.est-table th{background:var(--navy);color:#fff;padding:8px 8px;text-align:left;font-weight:600;font-size:0.75rem;letter-spacing:.05em;text-transform:uppercase}
.est-table th.r{text-align:right}
.est-table td{padding:7px 8px;border-bottom:1px solid #ddd;vertical-align:top}
.est-table td.r{text-align:right;white-space:nowrap}
.est-table td.det{font-size:0.75rem;color:#777;font-style:italic;padding-top:2px;padding-bottom:6px;padding-left:22px;border-bottom:1px solid #ddd;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.est-table tr.tot-row td{font-weight:700;border-top:2px solid #111;border-bottom:none;font-size:0.92rem;padding-top:10px}
.est-uline{border-bottom:1.5px solid #111;min-height:22px;margin-bottom:8px;padding-left:4px;font-size:0.88rem}
.est-disclaimer{font-size:0.78rem;color:#444;font-style:italic;line-height:1.6;margin-bottom:8px}
.est-notes-txt{font-size:0.85rem;color:#222;line-height:1.6;margin-bottom:8px}
.est-sig-sec{margin-top:28px}
.est-sig-title{font-weight:700;font-size:0.95rem;margin-bottom:10px}
.est-consent{font-size:0.82rem;font-weight:600;margin-bottom:18px;line-height:1.6;color:#111}
.est-sig-row{display:flex;gap:24px;margin-bottom:14px}
.est-sig-field{flex:1}
.sig-lbl{font-weight:700;font-size:0.82rem}
.sig-line{border-bottom:1.5px solid #111;height:24px;margin-top:2px;position:relative}
.sig-line-img img{position:absolute;left:24px;bottom:-16px;height:46px;pointer-events:none}
.sig-line-filled{display:flex;align-items:flex-end;padding-left:4px;padding-bottom:2px;font-size:0.88rem;color:#111}
.sig-date{width:110px;flex-shrink:0}

@media(max-width:480px){
  .est-sig-row{flex-direction:column;gap:12px}
  .sig-date{width:100%}
  .est-doc{padding:28px 16px 60px}
}
</style>
</head>
<body>

<!-- ═══════════ BUILDER ═══════════ -->
<div id="builderView">
<div class="hdr">
  <div class="hdr-title"><h1>Good &amp; Handy</h1><p>Estimate Builder</p></div>
  <div class="hdr-total"><div class="lbl">Total</div><div class="amt" id="hdrTotal">$0.00</div></div>
</div>
<div class="save-indicator" id="saveInd">Auto-save enabled</div>

<div class="wrap">

  <!-- Job Info -->
  <div class="card">
    <div class="card-head">Job Information</div>
    <div class="card-body">
      <div class="field-row"><label>Client Name</label><input type="text" id="f_client"></div>
      <div class="field-row"><label>Date</label><input type="date" id="f_date"></div>
      <div class="field-row"><label>Project Address</label><input type="text" id="f_addr"></div>
      <div class="field-row"><label>Estimated Duration</label><input type="text" id="f_duration"></div>
      <div class="field-row"><label>Additional Notes</label><textarea id="f_notes"></textarea></div>
    </div>
  </div>

  <!-- Custom Line Items -->
  <div class="card">
    <div class="card-head">Line Items</div>
    <div class="card-body">
      <div id="customLines"></div>
      <button class="add-btn" onclick="addCustom()">+ Add Line Item</button>
    </div>
  </div>

  <!-- Summary -->
  <div class="summary-card">
    <div class="s-head">Estimate Summary</div>
    <div class="s-body" id="sumBody"><div class="s-empty">No items added yet.</div></div>
  </div>

  <!-- Action buttons -->
  <div class="btn-row">
    <button class="btn btn-calc" onclick="recalc()">Recalculate</button>
    <button class="btn btn-clr" onclick="clearAll()">Clear All</button>
    <button class="btn btn-gen btn-gen" onclick="showEstimate()">Generate Estimate</button>
  </div>

</div><!-- /wrap -->
</div><!-- /builderView -->

<script>
// ══════════ CUSTOM LINES ══════════
let customCount = 0;
function addCustom() {
  const id = ++customCount;
  const row = document.createElement("div");
  row.className = "cust-row"; row.id = `crow_${id}`;
  row.innerHTML = `
    <div class="cust-desc"><span>Description</span><input type="text" id="cdesc_${id}" oninput="save();recalc()"></div>
    <div class="inp-grp"><span>Qty</span><input type="number" id="cqty_${id}" value="1" min="1" onchange="save();recalc()"></div>
    <div class="inp-grp"><span>$ / ea</span><input type="number" id="cprice_${id}" value="0" onchange="save();recalc()"></div>
    <div class="cust-det"><span>Details (optional)</span><input type="text" id="cdet_${id}" oninput="save();recalc()"></div>
    <button class="rm-btn" onclick="removeCustom(${id})">✕</button>`;
  document.getElementById("customLines").appendChild(row);
  save(); recalc();
}
function removeCustom(id) {
  document.getElementById(`crow_${id}`)?.remove();
  save(); recalc();
}

// ══════════ COLLECT ALL LINES ══════════
function getLines() {
  const lines = []; let total = 0;

  document.querySelectorAll("[id^='crow_']").forEach(row => {
    const id=row.id.split("_")[1];
    const desc=(document.getElementById(`cdesc_${id}`)?.value||"").trim();
    const qty=parseFloat(document.getElementById(`cqty_${id}`)?.value)||1;
    const pr=parseFloat(document.getElementById(`cprice_${id}`)?.value)||0;
    const det=(document.getElementById(`cdet_${id}`)?.value||"").trim();
    if (desc) { const sub=qty*pr; lines.push({name:desc,qty,unit:pr,sub,qtyLabel:"qty",det}); total+=sub; }
  });

  return {lines,total};
}

// ══════════ RECALC / SUMMARY ══════════
function recalc() {
  const {lines,total}=getLines();
  document.getElementById("hdrTotal").textContent=`$${total.toFixed(2)}`;
  const div=document.getElementById("sumBody");
  if (!lines.length){div.innerHTML='<div class="s-empty">No items added yet.</div>';return;}
  div.innerHTML=lines.map(l=>`
    <div class="s-line">
      <div><div>${l.name}${l.qtyLabel&&l.qty>0?` (${l.qty} ${l.qtyLabel})`:""}</div>${l.det?`<div class="s-det">${l.det}</div>`:""}</div>
      <div>$${l.sub.toFixed(2)}</div>
    </div>`).join("")+`<div class="s-line tot"><span>TOTAL</span><span>$${total.toFixed(2)}</span></div>`;
}

// ══════════ CLEAR ALL ══════════
function clearAll() {
  if (!confirm("Clear all selections and job info?")) return;
  // Job info
  ["f_client","f_date","f_addr","f_duration","f_notes"].forEach(id=>{
    const el=document.getElementById(id); if(el) el.value="";
  });
  // Custom
  document.getElementById("customLines").innerHTML="";
  customCount=0;
  localStorage.removeItem("gnh_estimate");
  setInd("Cleared");
  recalc();
}

// ══════════ AUTO SAVE ══════════
let saveTimer=null;
function save() {
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try {
      const state={
        job:{client:v("f_client"),date:v("f_date"),addr:v("f_addr"),duration:v("f_duration"),notes:v("f_notes")},
        custom:[],
      };
      // Custom
      document.querySelectorAll("[id^='crow_']").forEach(row=>{
        const id=row.id.split("_")[1];
        state.custom.push({
          id,
          desc:document.getElementById(`cdesc_${id}`)?.value||"",
          qty:document.getElementById(`cqty_${id}`)?.value||1,
          price:document.getElementById(`cprice_${id}`)?.value||0,
          det:document.getElementById(`cdet_${id}`)?.value||"",
        });
      });
      localStorage.setItem("gnh_estimate",JSON.stringify(state));
      setInd("Saved ✓");
    } catch(e){ setInd("Save error"); }
  },600);
}

function v(id){return document.getElementById(id)?.value||"";}
function setInd(msg){const el=document.getElementById("saveInd");if(el)el.textContent=msg;}

function loadState() {
  try {
    const raw=localStorage.getItem("gnh_estimate");
    if(!raw) return;
    const s=JSON.parse(raw);
    // Job
    if(s.job){
      sv("f_client",s.job.client);sv("f_date",s.job.date);sv("f_addr",s.job.addr);
      sv("f_duration",s.job.duration);sv("f_notes",s.job.notes);
    }
    // Custom
    if(s.custom&&s.custom.length){
      s.custom.forEach(c=>{
        const id=++customCount;
        const row=document.createElement("div");
        row.className="cust-row";row.id=`crow_${id}`;
        row.innerHTML=`
          <div class="cust-desc"><span>Description</span><input type="text" id="cdesc_${id}" oninput="save();recalc()" value="${c.desc||""}"></div>
          <div class="inp-grp"><span>Qty</span><input type="number" id="cqty_${id}" value="${c.qty||1}" min="1" onchange="save();recalc()"></div>
          <div class="inp-grp"><span>$ / ea</span><input type="number" id="cprice_${id}" value="${c.price||0}" onchange="save();recalc()"></div>
          <div class="cust-det"><span>Details (optional)</span><input type="text" id="cdet_${id}" oninput="save();recalc()" value="${c.det||""}"></div>
          <button class="rm-btn" onclick="removeCustom(${id})">✕</button>`;
        document.getElementById("customLines").appendChild(row);
      });
    }
    setInd("Restored from last session");
  } catch(e){ setInd("Auto-save enabled"); }
}

function sv(id,val){const el=document.getElementById(id);if(el&&val!==undefined&&val!=="")el.value=val;}

// ══════════ VIEWS ══════════
function showEstimate(){
  const {lines,total}=getLines();
  if(!lines.length){alert("No items added.");return;}
  const client=v("f_client"),date=fmtDate(v("f_date")),addr=v("f_addr"),
        duration=v("f_duration"),notes=v("f_notes");
  const fv2=(val,maxW)=>`<div class="efv"${maxW?` style="max-width:${maxW}"`:""}>${val}</div>`;

  const tableRows=lines.map(l=>{
    const qtyStr=l.qtyLabel?`${l.qty} ${l.qtyLabel}`:l.qty>1?`${l.qty}`:"1";
    const unitStr=`$${l.unit}`;
    const main=`<tr><td>${l.name}</td><td class="r">${qtyStr}</td><td class="r">${unitStr}</td><td class="r">$${l.sub.toFixed(2)}</td></tr>`;
    const det=l.det?`<tr><td class="det" colspan="4">${l.det}</td></tr>`:"";
    return main+det;
  }).join("");

function fmtDate(val){
  if(!val) return "";
  try{return new Date(val+"T00:00:00").toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});}
  catch{return val;}
}

function todayFormatted(){
  return new Date().toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});
}

// ══════════ RECEIVE PRESITE DATA FROM PORTAL ══════════
// Populates fields/line items from the Good & Handy portal's pre-site data.
// Everything set here is a plain .value assignment on normal inputs — nothing
// is disabled or readonly, so every field stays fully editable right up
// until "Generate Estimate" is clicked.
window.addEventListener("message", (e) => {
  const data = e.data;
  if (!data || data.source !== "gh_portal" || data.type !== "presite_data") return;

  const c = data.customer || {};
  if (c.name) sv("f_client", c.name);
  if (c.address) sv("f_addr", c.address);

  // Build a combined, human-readable notes block from description/issues/disclaimers.
  // This is a starting point only — the notes field remains a normal editable textarea.
  let notesParts = [];
  if (data.description) notesParts.push(data.description.trim());
  if (data.issues && data.issues.length) {
    notesParts.push("Potential issues:\n" + data.issues.map(t => "- " + t).join("\n"));
  }
  if (data.disclaimers && data.disclaimers.length) {
    notesParts.push("Disclaimers:\n" + data.disclaimers.map(t => "- " + t).join("\n"));
  }
  if (notesParts.length) sv("f_notes", notesParts.join("\n\n"));

  // Labor + materials come in as {item, price} where price is often a range or
  // free-text note (e.g. "$150-$400" or "included in job labor") rather than a
  // clean number, so we can't always populate a numeric $/ea reliably. We pull
  // out a leading dollar number when there is one and leave it at 0 otherwise —
  // either way the price/qty fields stay fully editable so it can be finalized by hand.
  const addAsLine = (item) => {
    const id = ++customCount;
    const row = document.createElement("div");
    row.className = "cust-row"; row.id = `crow_${id}`;
    const priceMatch = (item.price || "").match(/[\d,]+(\.\d+)?/);
    const priceVal = priceMatch ? parseFloat(priceMatch[0].replace(/,/g, "")) : 0;
    const detText = item.price || "";
    row.innerHTML = `
      <div class="cust-desc"><span>Description</span><input type="text" id="cdesc_${id}" oninput="save();recalc()" value="${(item.item||"").replace(/"/g,'&quot;')}"></div>
      <div class="inp-grp"><span>Qty</span><input type="number" id="cqty_${id}" value="1" min="1" onchange="save();recalc()"></div>
      <div class="inp-grp"><span>$ / ea</span><input type="number" id="cprice_${id}" value="${priceVal}" onchange="save();recalc()"></div>
      <div class="cust-det"><span>Details (optional)</span><input type="text" id="cdet_${id}" oninput="save();recalc()" value="${detText.replace(/"/g,'&quot;')}"></div>
      <button class="rm-btn" onclick="removeCustom(${id})">✕</button>`;
    document.getElementById("customLines").appendChild(row);
  };

  (data.labor || []).forEach(addAsLine);
  (data.materials || []).forEach(addAsLine);

  save();
  recalc();
  setInd("Pre-site data loaded — review before generating");
});

// ══════════ INIT ══════════
loadState();
recalc();

// Save on any input change across the whole page
document.addEventListener("input",()=>save());
document.addEventListener("change",()=>save());
</script>
</body>
</html>
